name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ApexMind APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure pre-installed Android SDK & install API 36.1
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDK_MANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            exit 1
          fi

          echo "Using sdkmanager at: $SDK_MANAGER"
          mkdir -p "$SDK_ROOT/licenses"
          (yes || true) | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          (yes || true) | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ]; then
            echo "ERROR: platforms;android-36.1 not installed under $SDK_ROOT/platforms"
            ls -la "$SDK_ROOT/platforms" || true
            exit 1
          fi

      - name: Prepare signing keystore and Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess

          def clean_invisible(text: str) -> str:
              return re.sub(r"[\ufeff\u200b\u200c\u200d\u2060]", "", text)

          def decode_b64_flexible(raw: str):
              s = clean_invisible(raw).strip()
              if (s.startswith('"') and s.endswith('"')) or (s.startswith("'") and s.endswith("'")):
                  s = s[1:-1].strip()
              s = re.sub(r"\s+", "", s)
              s = s.replace("-", "+").replace("_", "/")
              if not s:
                  return None, "empty after stripping whitespace"
              if not re.fullmatch(r"[A-Za-z0-9+/=]+", s):
                  bad = sorted(set(re.findall(r"[^A-Za-z0-9+/=]", s)))
                  return None, f"contains non-base64 characters (count={len(bad)})"
              s = s.rstrip("=")
              s += "=" * ((4 - len(s) % 4) % 4)
              try:
                  return base64.b64decode(s, validate=True), None
              except Exception as exc:
                  return None, str(exc)

          # 1. Decode debug.keystore from secret or fallback repo file
          ks_secret = os.environ.get("DEBUG_KEYSTORE_BASE64", "")
          if not os.path.exists("debug.keystore") and ks_secret.strip():
              print(f"Decoding debug.keystore from DEBUG_KEYSTORE_BASE64 secret (chars={len(ks_secret)})...")
              ks_bytes, err = decode_b64_flexible(ks_secret)
              if ks_bytes:
                  with open("debug.keystore", "wb") as f:
                      f.write(ks_bytes)
                  chk = subprocess.run(
                      ["keytool", "-list", "-keystore", "debug.keystore", "-storepass", "android"],
                      capture_output=True,
                      text=True,
                  )
                  if chk.returncode != 0:
                      print("WARNING: Decoded DEBUG_KEYSTORE_BASE64 is not a valid keystore; falling back.")
                      os.remove("debug.keystore")
              else:
                  print(f"WARNING: DEBUG_KEYSTORE_BASE64 could not be base64-decoded ({err}); falling back.")

          if not os.path.exists("debug.keystore") and os.path.exists("debug.keystore.base64"):
              print("Decoding debug.keystore from debug.keystore.base64...")
              with open("debug.keystore.base64", "r", encoding="utf-8", errors="replace") as f:
                  ks_bytes, err = decode_b64_flexible(f.read())
              if ks_bytes:
                  with open("debug.keystore", "wb") as f:
                      f.write(ks_bytes)
              else:
                  print(f"WARNING: debug.keystore.base64 decode failed ({err}).")

          # 2. Decode app/google-services.json from raw JSON or Base64 JSON
          gs_secret = os.environ.get("GOOGLE_SERVICES_JSON", "")
          if not os.path.exists("app/google-services.json") and gs_secret.strip():
              print(f"Processing GOOGLE_SERVICES_JSON secret (chars={len(gs_secret)})...")
              cleaned = clean_invisible(gs_secret).strip()
              if cleaned.startswith("```"):
                  cleaned = re.sub(r"^```[a-zA-Z0-9_-]*\s*", "", cleaned)
                  cleaned = re.sub(r"\s*```$", "", cleaned).strip()
              if (cleaned.startswith('"') and cleaned.endswith('"')) or (cleaned.startswith("'") and cleaned.endswith("'")):
                  cleaned = cleaned[1:-1].strip()

              parsed_json = None
              # Attempt A: raw JSON (or slice from first '{' to last '}')
              candidates = [cleaned]
              if "{" in cleaned and "}" in cleaned:
                  candidates.append(cleaned[cleaned.find("{"):cleaned.rfind("}") + 1])
              for cand in candidates:
                  try:
                      obj = json.loads(cand)
                      if isinstance(obj, dict) and ("project_info" in obj or "client" in obj):
                          parsed_json = json.dumps(obj, indent=2)
                          break
                  except Exception:
                      pass

              # Attempt B: base64-encoded JSON
              if parsed_json is None:
                  raw_bytes, err = decode_b64_flexible(cleaned)
                  if raw_bytes:
                      try:
                          decoded_text = clean_invisible(raw_bytes.decode("utf-8", errors="strict")).strip()
                          obj = json.loads(decoded_text)
                          if isinstance(obj, dict):
                              parsed_json = json.dumps(obj, indent=2)
                      except Exception as json_err:
                          print(f"WARNING: Base64-decoded GOOGLE_SERVICES_JSON is not valid JSON ({json_err}).")
                  else:
                      print(f"WARNING: GOOGLE_SERVICES_JSON is neither valid Firebase JSON nor valid Base64 ({err}).")

              if parsed_json is not None:
                  with open("app/google-services.json", "w", encoding="utf-8") as f:
                      f.write(parsed_json + "\n")
                  print("Successfully wrote app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          PY

          if [ ! -s debug.keystore ]; then
            echo "Generating CI debug.keystore via keytool..."
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          ls -lh debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:' || true

          echo "Runner memory:"
          free -h || true
          if [ -f app/google-services.json ]; then
            echo "app/google-services.json: present"
          else
            echo "NOTE: app/google-services.json is not present; APK will build, and Firebase features require valid app/google-services.json or GOOGLE_SERVICES_JSON secret."
            {
              echo "### Firebase Config Notice"
              echo "The APK built without a valid \`app/google-services.json\`. Ensure \`GOOGLE_SERVICES_JSON\` contains the complete raw JSON (or valid Base64) of \`app/google-services.json\` and \`DEBUG_KEYSTORE_BASE64\` contains the single-line Base64 string from \`debug.keystore.base64\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx512m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          set -o pipefail
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --max-workers=2 --no-configuration-cache --console=plain --stacktrace \
              "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" 2>&1 | tee build-debug.log
          else
            gradle assembleDebug --max-workers=2 --no-configuration-cache --console=plain --stacktrace \
              "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" 2>&1 | tee build-debug.log
          fi

      - name: Publish failure diagnostics
        if: failure()
        run: |
          {
            echo "### Build Failure Diagnostics"
            if [ -f build-debug.log ]; then
              echo '```text'
              tail -n 100 build-debug.log
              echo '```'
            else
              echo "No build-debug.log generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Debug APK output
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ApexMind-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Signed Release APK (optional, if secrets configured)
        id: release_build
        env:
          GRADLE_OPTS: "-Xmx512m -XX:+HeapDumpOnOutOfMemoryError"
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          set -e
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            python3 -c 'import base64, os, re; s = re.sub(r"[\ufeff\u200b\u200c\u200d\u2060\s]+", "", os.environ["RELEASE_KEYSTORE_BASE64"]).replace("-", "+").replace("_", "/").rstrip("="); s += "=" * ((4 - len(s) % 4) % 4); open(os.environ["KEYSTORE_PATH"], "wb").write(base64.b64decode(s))'
            if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
              ./gradlew assembleRelease --max-workers=2 --no-configuration-cache --console=plain --stacktrace \
                "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            else
              gradle assembleRelease --max-workers=2 --no-configuration-cache --console=plain --stacktrace \
                "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            fi
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping signed release APK (release secrets not set)."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK artifact
        if: steps.release_build.outputs.built == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ApexMind-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
